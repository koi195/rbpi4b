name: android-apk

# Builds the sideloadable APK. It contains the app, proot and its loaders -- and
# NOTHING from Pioneer/AlphaTheta. The player's own files are imported on the
# tablet from a bundle you build yourself (scripts/android/build-bundle.sh).

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - "scripts/android/**"
      - ".github/workflows/android.yml"

jobs:
  apk:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Fetch proot (arm64) from Termux packages
        run: bash scripts/android/fetch-proot.sh

      - name: Build
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: rbpi4b-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
