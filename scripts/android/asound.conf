# /etc/asound.conf inside the chroot — Android build only.
#
# The player's audio shim (audioshim.so) opens AUDIO_DEV and writes interleaved
# PCM into it with snd_pcm_writei(). On the Pi that is the DDJ-FLX4's USB card.
# Inside the Android app there is no ALSA card at all, so AUDIO_DEV=rbandroid
# names this device instead: ALSA's own `file` plugin over a `null` slave, which
# writes every byte the shim hands it into a FIFO that the app reads and plays
# through AudioTrack.
#
# Layout of what arrives (set by start-android.sh, read by the app):
#   44100 Hz, 4 channels, S24_3LE (3-byte packed little-endian), interleaved
#   channels 0,1 = master   channels 2,3 = headphones / cue
#
# The FIFO write blocks when the app has not drained it, which is what paces the
# player at real time — there is no hardware clock here, the consumer is the clock.
pcm.rbandroid {
    type file
    slave.pcm "rbnull"
    file "/tmp/rb_audio.fifo"
    format "raw"
    perm 0666
}
pcm.rbnull {
    type null
}
